global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'surveyor'
    # Matches surveyor's poll interval. Scraping faster only repeats samples.
    scrape_interval: 30s
    static_configs:
      - targets: ['surveyor']

  - job_name: 'geodesist'
    static_configs:
      - targets: ['geodesist']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'macos'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'icmp'
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
          - 8.8.8.8
          - 8.8.4.4
          - 1.1.1.1
          - 1.0.0.1
          - 192.168.119.1
          - 192.168.100.1
          - 50.234.106.9
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: 'tcp'
    metrics_path: /probe
    params:
      module: [tcp]
    static_configs:
      - targets:
          - 8.8.8.8:53
          - 8.8.4.4:53
          - 1.1.1.1:53
          - 1.0.0.1:53
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: 'dns'
    metrics_path: /probe
    params:
      module: [dns]
    static_configs:
      - targets:
          - 8.8.8.8
          - 8.8.4.4
          - 1.1.1.1
          - 1.0.0.1
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

# Off-site copy on Grafana Cloud's free tier, for viewing the dashboards away
# from home. Push only: nothing outside the house connects in. The free tier
# caps billable series at 10k, counted per sample per minute, so the 5s node and
# macos jobs (~30k on their own) stay local. The rest is ~4,900. Grafana Cloud
# keeps 14 days; the local TSDB remains the long-term archive.
remote_write:
  - url: https://prometheus-prod-56-prod-us-east-2.grafana.net/api/prom/push
    basic_auth:
      username: '3625238'
      password_file: /etc/prometheus/grafana-cloud-token
    write_relabel_configs:
      - source_labels: [job]
        regex: icmp|tcp|dns|surveyor|geodesist
        action: keep
