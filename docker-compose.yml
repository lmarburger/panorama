# Pinned so the project name never depends on the directory name again. Compose
# derives it from the directory by default, which silently reparents the data
# volumes if the checkout is ever moved or renamed.
name: panorama

volumes:
  # These keep their original `surveyor_` prefix from when the checkout lived in
  # a directory of that name. Renaming them would mean copying 12.5 GB of TSDB
  # for no functional gain, so they are pinned explicitly instead.
  #
  # `external` means compose will not create or destroy them. That is deliberate:
  # it makes `docker compose down -v` unable to take 200+ days of history with it.
  # `scripts/setup` creates them on a fresh machine.
  grafana:
    name: surveyor_grafana
    external: true
  prometheus:
    name: surveyor_prometheus
    external: true

services:
  surveyor:
    container_name: surveyor
    build:
      context: ../surveyor
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - "--addr=:80"
    expose:
      - 80

  geodesist:
    container_name: geodesist
    build:
      context: ../geodesist
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - AMPLIFI_PASSWORD=${AMPLIFI_PASSWORD}
    command:
      - "--addr=:80"
      - "--router=${AMPLIFI_ROUTER_ADDR:-http://192.168.119.1}"
    expose:
      - 80

  grafana:
    container_name: grafana
    image: grafana/grafana-oss:13.0.2
    restart: unless-stopped
    environment:
      # Grafana nags about the default password until it is changed. This only
      # takes effect when the volume is first created; on an existing volume the
      # password must be changed through the API or the UI.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-smokeping}
    volumes:
      - grafana:/var/lib/grafana
    ports:
      # Bound to loopback plus the Mac's static LAN lease rather than 0.0.0.0, so
      # Grafana is unreachable from any other network the laptop joins. OrbStack
      # accepts a binding for an address the host does not currently hold, so off
      # the home LAN the container still starts and stays reachable on loopback;
      # the LAN address simply serves nothing until the Mac is home again.
      - "127.0.0.1:4242:3000"
      - "${GRAFANA_LAN_IP:-192.168.119.4}:4242:3000"

  prometheus:
    container_name: prometheus
    hostname: prometheus
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    volumes:
      - prometheus:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      # - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - "--storage.tsdb.retention.time=730d"
      - "--storage.tsdb.path=/prometheus/"
      - "--web.enable-admin-api"
    expose:
      - 9090
    extra_hosts:
      - "host.docker.internal:host-gateway" # enables host.docker.internal as a dns name

  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox
    restart: unless-stopped
    volumes:
      - ./blackbox.yml:/etc/blackbox/blackbox.yml
    command:
      - --config.file=/etc/blackbox/blackbox.yml
      - --log.level=debug
    expose:
      - 9115

  # export basic system metrics
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - 9100

